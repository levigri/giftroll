<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0C10" />
    <title>GiftRoll — промо-ролл</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        position: relative;
        width: 100vw;
        height: 100svh;
        margin: 0;
        overflow: hidden;
        background: #080910;
        color: #fff;
        font-family: 'Manrope', sans-serif;
      }
      .ad-frame {
        position: absolute;
        top: 50%;
        left: 50%;
        isolation: isolate;
        container-type: inline-size;
        width: 2560px;
        height: 1440px;
        transform: translate(-50%, -50%) scale(var(--fit-scale, 1));
        transform-origin: center;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 72px;
        background:
          radial-gradient(ellipse at 51% 8%, rgba(114,71,186,.17), transparent 37%),
          radial-gradient(ellipse at 50% 112%, rgba(255,194,76,.12), transparent 34%),
          linear-gradient(145deg, #171521, #0d0e16 55%, #121018);
        box-shadow: 0 26px 84px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
      }
      .ad-frame::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: radial-gradient(ellipse at 50% 54%, rgba(108,75,185,.08), transparent 58%);
        content: '';
        pointer-events: none;
      }
      .brandbar {
        position: absolute;
        z-index: 8;
        top: 4.3%;
        right: 4.2%;
        left: 4.2%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brandbar__name {
        display: inline-flex;
        align-items: center;
        gap: 1cqw;
        color: rgba(255,255,255,.82);
        font-size: 1.45cqw;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .brandbar__dot {
        width: .7cqw;
        height: .7cqw;
        border-radius: 50%;
        background: #59e3b4;
        box-shadow: 0 0 10px rgba(89,227,180,.8);
      }
      .brandbar__wallet {
        padding: .8cqw 1.3cqw;
        border: 1px solid rgba(255,215,0,.2);
        border-radius: 999px;
        background: rgba(255,215,0,.07);
        color: #ffdc62;
        font-size: 1.35cqw;
        font-weight: 800;
        white-space: nowrap;
      }
      .roulette-window {
        position: absolute;
        top: 17%;
        right: 2.2%;
        left: 2.2%;
        height: 38%;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 2.6cqw;
        background: rgba(5,6,12,.52);
        box-shadow: inset 0 0 42px rgba(0,0,0,.32);
      }
      .roulette-window::before, .roulette-window::after {
        position: absolute;
        z-index: 4;
        top: 0;
        bottom: 0;
        width: 12%;
        content: '';
        pointer-events: none;
      }
      .roulette-window::before { left: 0; background: linear-gradient(90deg, #12131d, rgba(18,19,29,.72) 32%, transparent); }
      .roulette-window::after { right: 0; background: linear-gradient(270deg, #12131d, rgba(18,19,29,.72) 32%, transparent); }
      .roulette-idle-veil {
        position: absolute;
        z-index: 5;
        inset: 0;
        background: rgba(7,8,14,.22);
        -webkit-backdrop-filter: blur(12px) brightness(.62) saturate(.65);
        backdrop-filter: blur(12px) brightness(.62) saturate(.65);
        transition: opacity .45s ease, visibility .45s ease, backdrop-filter .45s ease;
      }
      .roulette-window.is-spinning .roulette-idle-veil,
      .roulette-window.is-won .roulette-idle-veil {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        -webkit-backdrop-filter: blur(0) brightness(1) saturate(1);
        backdrop-filter: blur(0) brightness(1) saturate(1);
      }
      .roulette-track {
        position: absolute;
        top: 50%;
        left: 0;
        display: flex;
        width: max-content;
        align-items: center;
        gap: 1cqw;
        transform: translateY(-50%);
        will-change: transform;
      }
      .roulette-card {
        position: relative;
        display: flex;
        width: 9.1cqw;
        height: 14.2cqw;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: .45cqw;
        overflow: hidden;
        padding: .7cqw;
        border: 1px solid rgba(174,183,215,.12);
        border-radius: 1.8cqw;
        background: linear-gradient(145deg, rgba(59,66,98,.65), rgba(27,29,43,.88));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 8px 20px rgba(0,0,0,.14);
      }
      .roulette-card img {
        width: 76%;
        height: 68%;
        object-fit: contain;
        filter: drop-shadow(0 5px 8px rgba(0,0,0,.38));
      }
      .roulette-card__name {
        max-width: 100%;
        overflow: hidden;
        color: rgba(240,241,250,.78);
        font-size: .9cqw;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .roulette-pointer {
        position: absolute;
        z-index: 6;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, transparent, #ffd45d 12%, #ffd45d 88%, transparent);
        box-shadow: 0 0 12px rgba(255,212,93,.65);
        pointer-events: none;
      }
      .roulette-pointer::before, .roulette-pointer::after {
        position: absolute;
        left: 50%;
        width: 0;
        height: 0;
        content: '';
        transform: translateX(-50%);
      }
      .roulette-pointer::before { top: 0; border-top: 1.3cqw solid #ffd45d; border-right: 1cqw solid transparent; border-left: 1cqw solid transparent; }
      .roulette-pointer::after { bottom: 0; border-right: 1cqw solid transparent; border-bottom: 1.3cqw solid #ffd45d; border-left: 1cqw solid transparent; }
      .roulette-watermark {
        position: absolute;
        z-index: 1;
        right: 10px;
        bottom: 5px;
        left: 10px;
        overflow: hidden;
        color: rgba(226,219,245,.12);
        font-size: 2.2cqw;
        font-weight: 800;
        letter-spacing: .15em;
        text-align: center;
        text-overflow: clip;
        white-space: nowrap;
        pointer-events: none;
      }
      .roulette-winner {
        z-index: 2;
        animation: winner-flash .8s cubic-bezier(.2,.85,.25,1.2) both;
      }
      @keyframes winner-flash {
        0% { transform: scale(1); border-color: rgba(255,255,255,.12); box-shadow: none; }
        45% { transform: scale(1.24); border-color: #ffdf68; box-shadow: 0 0 34px rgba(255,205,68,.8); }
        100% { transform: scale(1.14); border-color: rgba(255,219,99,.9); box-shadow: 0 0 24px rgba(255,198,56,.48); }
      }
      .reveal {
        position: absolute;
        z-index: 7;
        top: 17%;
        right: 2.2%;
        left: 2.2%;
        height: 38%;
        display: block;
        border-radius: 2.6cqw;
        background: rgba(7,8,14,.28);
        -webkit-backdrop-filter: blur(0) brightness(1) saturate(1);
        backdrop-filter: blur(0) brightness(1) saturate(1);
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px) scale(.98);
        pointer-events: none;
      }
      .reveal.is-visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
        -webkit-backdrop-filter: blur(20px) brightness(.58) saturate(.65);
        backdrop-filter: blur(20px) brightness(.58) saturate(.65);
        transition: opacity .45s ease, transform .55s cubic-bezier(.18,.85,.25,1.1), backdrop-filter .65s ease, visibility .45s;
      }
      .reveal__image-wrap {
        position: absolute;
        top: 50%;
        left: 43%;
        display: grid;
        width: 22%;
        height: 90%;
        transform: translate(-50%, -50%);
        place-items: center;
      }
      .reveal__halo {
        position: absolute;
        width: 115%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(153,77,255,.28), rgba(131,55,227,.1) 45%, transparent 71%);
        filter: blur(7px);
      }
      .reveal.is-visible .reveal__halo {
        animation: halo-pulse 1.6s ease-in-out 2;
      }
      .reveal__image {
        position: relative;
        z-index: 1;
        display: block;
        width: min(100%, 20cqw);
        max-height: 100%;
        object-fit: contain;
        mix-blend-mode: screen;
        -webkit-mask-image: radial-gradient(ellipse 74% 74% at 50% 48%, #000 70%, transparent 100%);
        mask-image: radial-gradient(ellipse 74% 74% at 50% 48%, #000 70%, transparent 100%);
        filter: brightness(1.35) contrast(1.1) drop-shadow(0 16px 30px rgba(151,71,255,.55));
        opacity: 0;
        transform: scale(.42) rotate(-8deg);
      }
      .reveal.is-visible .reveal__image {
        animation: gift-arrive .75s cubic-bezier(.18,.9,.24,1.2) both;
      }
      .reveal__copy {
        position: absolute;
        top: 40%;
        left: calc(43% + 11.5%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
        color: #fff;
        opacity: 0;
        filter: blur(8px);
        transform: translateY(-50%);
        text-align: left;
        transition: opacity .45s ease .12s, filter .55s ease .12s;
      }
      .reveal.is-visible .reveal__copy {
        opacity: 1;
        filter: blur(0);
      }
      .reveal__brand {
        min-height: 1em;
        margin: 0;
        background: linear-gradient(100deg, #fff 5%, #e7d5ff 40%, #b559ff 75%, #ffd873);
        background-clip: text;
        color: transparent;
        font-size: 7cqw;
        font-weight: 800;
        letter-spacing: -.075em;
        line-height: 1.05;
        white-space: nowrap;
      }
      .reveal__brand::after {
        display: inline-block;
        width: .06em;
        height: .76em;
        margin-left: .1em;
        border-radius: 2px;
        background: #ffd45d;
        content: '';
        vertical-align: -.02em;
        animation: caret 650ms steps(2, start) infinite;
      }
      .reveal__play {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5cqw;
        padding: 1.1cqw 3cqw;
        border: 1px solid rgba(255,248,197,.72);
        border-radius: 999px;
        background: linear-gradient(110deg, #ffe34f, #ffad18 72%, #ff8a00);
        box-shadow: 0 0 30px rgba(255,190,35,.38), inset 0 1px 0 rgba(255,255,255,.55);
        color: #17120a;
        font-size: 1.8cqw;
        font-weight: 900;
        letter-spacing: .03em;
        text-decoration: none;
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px) scale(.96);
        transition: opacity .28s ease, transform .32s cubic-bezier(.18,.85,.25,1.15), visibility .28s;
      }
      .reveal__play.is-ready {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }
      .reveal__play:hover { filter: brightness(1.08); }
      .reveal__play:active { transform: scale(.97); }
      .case-open {
        position: absolute;
        z-index: 9;
        top: 50%;
        left: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18cqw;
        padding: 1.15cqw 3.2cqw;
        border: 1px solid rgba(255,248,197,.76);
        border-radius: 999px;
        background: linear-gradient(110deg, #ffe34f, #ffad18 72%, #ff8a00);
        box-shadow: 0 0 34px rgba(255,190,35,.32), inset 0 1px 0 rgba(255,255,255,.5);
        color: #17120a;
        font: inherit;
        font-size: 1.65cqw;
        font-weight: 900;
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: opacity .25s ease, transform .25s ease, filter .2s ease;
      }
      .case-open:hover { filter: brightness(1.08); }
      .case-open:active { transform: translate(-50%, -50%) scale(.97); }
      .case-open.is-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(.9);
      }
      .case-open:disabled { cursor: wait; }
      .stage-caption {
        position: absolute;
        z-index: 3;
        top: 60%;
        right: 10%;
        left: 10%;
        color: rgba(255,255,255,.32);
        font-size: 1.25cqw;
        font-weight: 800;
        letter-spacing: .18em;
        text-align: center;
        text-transform: uppercase;
        transition: opacity .2s ease;
        pointer-events: none;
      }
      .stage-caption.is-hidden { opacity: 0; }
      .roulette-window.is-won .roulette-pointer { opacity: 0; }
      @keyframes halo-pulse { 0%,100% { opacity: .65; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes gift-arrive { from { opacity: 0; transform: scale(.42) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes caret { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="ad-frame" aria-label="GiftRoll promo">
      <header class="brandbar">
        <div class="brandbar__name"><span class="brandbar__dot"></span> GiftRoll</div>
        <div class="brandbar__wallet">★ 10 000</div>
      </header>

      <div id="rouletteWindow" class="roulette-window" aria-label="Рулетка">
        <div id="rouletteTrack" class="roulette-track"></div>
        <div class="roulette-watermark">@Giftrollgamebot</div>
        <div class="roulette-pointer"></div>
        <div class="roulette-idle-veil" aria-hidden="true"></div>
        <button id="openCaseButton" class="case-open" type="button">Открыть кейс</button>
      </div>

      <div id="stageCaption" class="stage-caption">Супер Дроп · 349 ⭐</div>

      <section id="reveal" class="reveal" aria-live="polite">
        <div class="reveal__image-wrap">
          <div class="reveal__halo"></div>
          <img class="reveal__image" src="public/promo-gift.jpg" alt="Подарок GiftRoll" />
        </div>
        <div class="reveal__copy">
          <h1 id="revealBrand" class="reveal__brand"></h1>
          <a id="revealButton" class="reveal__play" href="https://t.me/Giftrollgamebot" target="_blank" rel="noopener noreferrer">Играть</a>
        </div>
      </section>

    </main>

    <!-- Музыку можно добавить позже: public/promo-music.mp3 -->
    <script>
      function fitCanvas() {
        const scale = Math.min(1, window.innerWidth / 2560, window.innerHeight / 1440)
        document.documentElement.style.setProperty('--fit-scale', String(scale))
      }
      fitCanvas()
      window.addEventListener('resize', fitCanvas)

      const items = [
        { name: 'Xmas Stocking', image: 'XmasStocking' },
        { name: 'Ice Cream', image: 'IceCream' },
        { name: 'Pet Snake', image: 'PetSnake' },
        { name: 'Lol Pop', image: 'LolPop' },
        { name: 'Fresh Socks', image: 'FreshSocks' },
        { name: 'Snow Mittens', image: 'SnowMittens' },
        { name: 'Love Potion', image: 'LovePotion' },
        { name: 'Genie Lamp', image: 'GenieLamp' },
        { name: 'Plush Pepe', image: 'PlushPepe' },
        { name: 'DurovsCap', image: 'DurovsCap' },
        { name: 'Heart Locket', image: 'HeartLocket' },
        { name: 'Pool Float', image: 'PoolFloat' },
      ]
      const WINNER_INDEX = 37
      const SPIN_DURATION_MS = 4700
      const track = document.getElementById('rouletteTrack')
      const viewport = document.getElementById('rouletteWindow')
      const reveal = document.getElementById('reveal')
      const stageCaption = document.getElementById('stageCaption')
      const revealBrand = document.getElementById('revealBrand')
      const revealButton = document.getElementById('revealButton')
      const openCaseButton = document.getElementById('openCaseButton')
      const winner = items.find((item) => item.name === 'Plush Pepe')
      let opening = false

      function imageUrl(item) {
        return 'https://api.changes.tg/original/' + item.image + '.png?size=256'
      }

      function makeCard(item) {
        const card = document.createElement('div')
        card.className = 'roulette-card'
        const image = document.createElement('img')
        image.src = imageUrl(item)
        image.alt = item.name
        image.loading = 'eager'
        image.onerror = () => {
          image.onerror = null
          image.src = 'public/icon.png'
          image.style.opacity = '.55'
        }
        const name = document.createElement('span')
        name.className = 'roulette-card__name'
        name.textContent = item.name
        card.append(image, name)
        return card
      }

      const strip = Array.from({ length: 50 }, (_, index) =>
        index === WINNER_INDEX ? winner : items[(index * 7 + Math.floor(index / 3)) % (items.length - 1)],
      )
      strip.forEach((item) => track.appendChild(makeCard(item)))

      function typeText(target, text, delay, done) {
        let index = 0
        target.textContent = ''
        function next() {
          if (index >= text.length) {
            if (done) done()
            return
          }
          target.textContent += text[index]
          index += 1
          window.setTimeout(next, delay)
        }
        next()
      }

      function resetScene() {
        reveal.classList.remove('is-visible')
        revealButton.classList.remove('is-ready')
        viewport.classList.remove('is-spinning')
        viewport.classList.remove('is-won')
        revealBrand.textContent = ''
        stageCaption.classList.remove('is-hidden')
        track.children[WINNER_INDEX].classList.remove('roulette-winner')
        track.style.transition = 'none'
        track.style.transform = 'translateX(0px) translateY(-50%)'
        void track.offsetWidth
      }

      function runSpin() {
        if (opening) return
        opening = true
        resetScene()
        openCaseButton.disabled = true
        openCaseButton.classList.add('is-hidden')
        viewport.classList.add('is-spinning')
        stageCaption.textContent = 'Открываем кейс · крутим рулетку'
        window.requestAnimationFrame(() => {
          const winnerCard = track.children[WINNER_INDEX]
          const baseCenter = winnerCard.offsetLeft + winnerCard.clientWidth / 2
          const randomOffset = (Math.random() * 2 - 1) * winnerCard.clientWidth * .22
          const offset = viewport.clientWidth / 2 - baseCenter + randomOffset
          track.style.transition = 'transform ' + SPIN_DURATION_MS + 'ms cubic-bezier(.12,.8,.15,1)'
          track.style.transform = 'translateX(' + offset + 'px) translateY(-50%)'
        })

        window.setTimeout(() => {
          track.children[WINNER_INDEX].classList.add('roulette-winner')
          stageCaption.classList.add('is-hidden')
          viewport.classList.add('is-won')
          window.setTimeout(() => {
            reveal.classList.add('is-visible')
            typeText(revealBrand, 'GiftRoll', 82, () => {
              revealButton.classList.add('is-ready')
            })
          }, 650)
        }, SPIN_DURATION_MS)
      }

      openCaseButton.addEventListener('click', runSpin)
    </script>
  </body>
</html>
