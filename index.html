<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0C10" />
    <title>GiftRoll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background: #0b0c10">
    <!-- Статичный прелоадер: убирается App'ом после первого рендера. -->
    <div
      id="boot-preloader"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0c10;
        color: #9ca3af;
        font-family: Manrope, system-ui, sans-serif;
      "
    >
      <span
        style="
          width: 44px;
          height: 44px;
          border: 3px solid rgba(255, 215, 0, 0.18);
          border-top-color: #ffd700;
          border-radius: 50%;
          animation: boot-preloader-spin 0.8s linear infinite;
        "
      ></span>
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.06em">Загрузка...</span>
      <style>
        @keyframes boot-preloader-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
